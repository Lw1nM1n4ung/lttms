version: '3.8'

services:
  web:
    build: .
    ports:
      - "0.0.0.0:8888:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=lttms_db
      - DB_USER=lttms_user
      - DB_PASS=lttms_password
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lttms_db
      MYSQL_USER: lttms_user
      MYSQL_PASSWORD: lttms_password
    ports:
      - "3307:3306"
    volumes:
      - lttms_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lttms_mysql_data:
